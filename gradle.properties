# Low-memory build profile (sandbox cgroup wall ~954M — host RAM is NOT available to us).
# CRITICAL: --no-daemon still forks a single-use build JVM; its args come from
# org.gradle.jvmargs HERE (GRADLE_OPTS only affects the launcher!). Keep heap
# under ~300m or the cgroup OOM-kills the build (older default Xmx512m did).
# NOTE: an earlier version of this line was corrupted with a literal
# "...[truncated]" string inside the value — that silently broke builds. Intact now.
org.gradle.jvmargs=-Xmx200m -Xms32m -XX:MaxMetaspaceSize=200m -XX:MaxDirectMemorySize=12m -XX:ReservedCodeCacheSize=8m -XX:+UseSerialGC -XX:MinHeapFreeRatio=5 -XX:MaxHeapFreeRatio=20 -XX:ActiveProcessorCount=1 -XX:-UsePerfData -Xss256k -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
ksp.useKSP2=true
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.daemon.performance.disable-logging=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
