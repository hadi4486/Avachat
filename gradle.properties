# Low-memory build profile (sandbox cgroup ~954M, hermes ~304M resident).
# CRITICAL: --no-daemon still forks a single-use build JVM; its args come from
# org.gradle.jvmargs HERE (GRADLE_OPTS only affects the launcher!). Default
# Xmx512m was silently blowing the cgroup wall. One JVM does everything
# (KSP2 in-process, kotlinc in-process, SerialGC = smallest footprint).
org.gradle.jvmargs=-Xmx280m -Xms32m -XX:MaxMetaspaceSize=165m -XX:MaxDirectMemorySize=12m -XX:ReservedCodeCacheSize=8m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:-UsePerfData -Xss256k -Dfile.enco...[truncated]
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
ksp.useKSP2=true
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.daemon.performance.disable-logging=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
